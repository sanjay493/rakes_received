app = 'rakes-received'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
