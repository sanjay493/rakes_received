<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transit Analytics System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        header {
            background: #1f3a5f;
            color: white;
            padding: 15px 30px;
        }
        .container {
            padding: 20px 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Unit Buttons */
        .unit-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .unit-btn {
            padding: 12px 24px;
            background: #e8eef5;
            color: #1f3a5f;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .unit-btn:hover {
            background: #d0dce8;
            transform: translateY(-2px);
        }
        .unit-btn.active {
            background: #1f3a5f;
            color: white;
            border-color: #1f3a5f;
            box-shadow: 0 4px 8px rgba(31, 58, 95, 0.3);
        }
        
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        select, input, button {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        select, input {
            width: 100%;
        }
        button {
            width: auto;
            min-width: 150px;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #1f3a5f;
            box-shadow: 0 0 0 2px rgba(31, 58, 95, 0.1);
        }
        
        /* Button Styles */
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-primary, .btn-secondary {
            padding: 12px 24px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            min-width: 150px;
            width: auto;
        }
        .btn-primary {
            background: #1f3a5f;
            color: white;
        }
        .btn-primary:hover {
            background: #162c46;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .btn-secondary {
            background: #4a90e2;
            color: white;
        }
        .btn-secondary:hover {
            background: #357abd;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        button {
            background: #1f3a5f;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #162c46;
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 280px));
            gap: 20px;
            margin-top: 15px;
        }
        .graph-box {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        footer {
            text-align: center;
            padding: 15px;
            background: #eee;
            margin-top: 20px;
        }

        /* Header: the title and links wrap onto more lines on a narrow screen. */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 20px;
        }
        .topbar h2 {
            margin: 10px 0;
        }
        .topnav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .topnav a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        img, svg, video {
            max-width: 100%;
        }

        /* Phones and small tablets */
        @media (max-width: 700px) {
            header {
                padding: 8px 12px;
            }
            .topbar h2 {
                font-size: 18px;
                margin: 4px 0;
            }
            .topnav {
                gap: 6px;
            }
            .topnav a {
                padding: 6px 10px;
                font-size: 14px;
            }
            .container {
                padding: 12px 10px;
            }
            .card, .graph-box {
                padding: 14px 12px;
            }
            .card h2 {
                font-size: 20px;
            }
            .card h3 {
                font-size: 17px;
            }
            .filter-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            /* Buttons share the row instead of each needing 150px. */
            button, .btn-primary, .btn-secondary {
                min-width: 0;
            }
            .button-group > * {
                flex: 1 1 140px;
            }
            .unit-buttons {
                gap: 6px;
            }
            .unit-btn {
                padding: 8px 12px;
                font-size: 14px;
            }
            /* 16px stops iPhones zooming in when a field is tapped. */
            select, input, textarea {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="topbar">
        <h2>🚆 Transit Time Analytics Dashboard</h2>
        <nav class="topnav">
            <a href="/upload">Upload</a>
            <a href="/">Dashboard</a>
            <a href="/commodity_analysis">Commodity Analysis</a>
            <a href="/inbound">In-Bound</a>
            <a href="/enroute">All-India</a>
        </nav>
    </div>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    <small>Internal Analytics System</small>
</footer>

</body>
</html>
